        stroke="#d0d0d0" stroke-width="2"/>
  <rect x="7.5" y="9" width="9" height="6" rx="1" fill="none"
        stroke="#d0d0d0" stroke-width="1.5" stroke-dasharray="2 2"/>
  <circle cx="8.5" cy="7" r="0.9" fill="#d0d0d0"/>
</svg>
