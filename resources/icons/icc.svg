        stroke-width="2.4" stroke-linecap="round"/>
  <path d="M16 18.93 A8 8 0 0 1 4 12" fill="none" stroke="#8fbc8f"
        stroke-width="2.4" stroke-linecap="round"/>
  <path d="M4 12 A8 8 0 0 1 16 5.07" fill="none" stroke="#7fa8d8"
        stroke-width="2.4" stroke-linecap="round"/>
</svg>
